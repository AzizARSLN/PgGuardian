[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pgguardian"
version = "0.1.0"
description = "PostgreSQL diagnostics without the complexity — health, connections, queries, locks, storage, indexes and maintenance from your terminal."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PgGuardian Contributors" }]
keywords = ["postgresql", "diagnostics", "health", "dba", "cli", "devops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "psycopg[binary]>=3.1",
    "typer>=0.9",
    "rich>=13",
    "pydantic>=2",
    "pydantic-settings>=2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlparse>=0.5",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",
]

[project.scripts]
pgguardian = "pgguardian.cli.app:app"

[project.urls]
Homepage = "https://github.com/anomalyco/pgGuardian"
Documentation = "https://github.com/anomalyco/pgGuardian/tree/main/docs"
Issues = "https://github.com/anomalyco/pgGuardian/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pgguardian"]

[tool.hatch.build.targets.wheel.force-include]
"sql" = "pgguardian/sql"

[tool.hatch.build.targets.sdist]
packages = ["src/pgguardian"]
artifacts = ["sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["pgguardian"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = [
    "E501",
    # B008 flags FastAPI's standard Depends() idiom; FastAPI docs recommend ignoring it.
    "B008",
    # BLE001 used intentionally where job results must capture every failure.
    "BLE001",
]

[tool.ruff.format]

[tool.mypy]
python_version = "3.11"
files = "src"
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
show_error_codes = true
