name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pgguardian
          POSTGRES_PASSWORD: pgguardian
          POSTGRES_DB: pgguardian
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U pgguardian -d pgguardian"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy
        run: mypy src

      - name: Seed database
        run: psql "$PGGUARDIAN_TEST_CONNECTION_STRING" -f docker/init.sql
        env:
          PGGUARDIAN_TEST_CONNECTION_STRING: host=localhost port=5432 dbname=pgguardian user=pgguardian password=1

      - name: pytest
        run: pytest
        env:
          PGGUARDIAN_TEST_CONNECTION_STRING: host=localhost port=5432 dbname=pgguardian user=pgguardian password=1

      - name: Coverage
        run: pytest --cov=src/pgguardian --cov-report=term-missing --cov-fail-under=70
        env:
          PGGUARDIAN_TEST_CONNECTION_STRING: host=localhost port=5432 dbname=pgguardian user=pgguardian password=1
